services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pickeat-sse
    restart: always
    expose:
      - "8080"  # 내부 네트워크만 노출
    networks:
      - app-tier
    environment:
      SPRING_ACTIVE_PROFILE: prod
      CORS_ALLOWED_ORIGINS: "https://dev.pickeat.io.kr,https://dev.api.pickeat.io.kr,http://localhost:3000"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: pickeat-redis
    restart: always
    command: [ "redis-server", "--appendonly", "no", "--save", "" ]
    expose:
      - "6379"
    networks:
      - app-tier

networks:
  app-tier:
    external: true
    name: docker_app-tier
